input QuarantineTimeRangeSelector {
  packageName: String!
  createdAtStart: DateTime
  createdAtEnd: DateTime
  subdir: String
}

input QuarantineVariantListSelector {
  filenames: [String!]!
  subdir: String
  """
  Required when `allowEmpty: true` is used and zero filenames
  resolve to existing entries — the package name can't be
  inferred from filenames alone in that case. Ignored otherwise.
  """
  packageName: String
}

"""
The query root of Prefix.dev's GraphQL interface.
"""
type Query {
  """
  Look up all channels
  """
  channels(filters: ChannelFilter, orderBy: ChannelOrderBy, limit: Int, page: Int): ChannelPageResult!
  """
  Look up a channel by its public reference ("namespace" or
  "namespace/name").
  """
  channel(name: String!): Channel
  """
  Returns the distinct billing-owner names of all channels the current user can see.
  """
  channelOwners: [String!]!
  """
  Returns the distinct namespace names of all channels the current user can see.
  """
  channelNamespaces: [String!]!
  """
  Return channels that the current session user may select for a scoped API key.
  """
  apiKeyChannelCandidates(accessMode: ChannelAccessMode!, filters: ChannelFilter, limit: Int, page: Int): ChannelPageResult!
  """
  Check if the current user can manage a channel, and why.
  """
  channelManageAccess(channelName: String!): ChannelManageAccess!
  """
  Check if the current user can perform lifecycle operations on a channel.
  """
  channelLifecycleAccess(channelName: String!): ChannelLifecycleAccess!
  """
  Look up a background job by its public ID.
  """
  backgroundJob(id: String!): BackgroundJob
  """
  Look up the most recent active (PENDING or IN_PROGRESS) background job
  for a channel, optionally filtered by job type.
  """
  activeBackgroundJob(channelName: String!, jobType: BackgroundJobType): BackgroundJob
  """
  Look up a single quarantine by id. Returns `None` when the id
  doesn't exist; errors when the caller can't admin the owning
  channel.
  """
  quarantine(id: Int!): Quarantine
  """
  Paginated listing of quarantines across every channel. Server
  admins only — no per-channel membership check. Filter by
  `channelName` to narrow; omit for the full cross-channel view.
  """
  quarantines(filter: QuarantineFilter, limit: Int, page: Int): QuarantinePageResult!
  """
  Look up all packages

  When using similarity-based ordering, results are automatically prioritized
  by channel size to surface packages from larger, more established channels.
  """
  packages(filters: PackageFilter, orderBy: PackageOrderBy, limit: Int, page: Int): PackagePageResult!
  """
  Look up a package by name
  """
  package(channelName: String!, name: String!): Package
  """
  Find the package that best matches the specified query
  """
  packageByMatchspec(matchSpec: String!, channels: [String!]!): Package
  """
  Look up a variant by its unique properties. The channel is addressed
  by its public reference ("namespace" or "namespace/name").
  """
  variant(channelName: String!, packageName: String!, platformName: String!, fileName: String!): PackageVariant
  """
  Look up a variant by it's paths
  """
  paths(pattern: String!): PackageVariant
  """
  The currently authenticated user.
  """
  viewer: User
  """
  Look up a single user by their login.

  The same user `users(filters: { login: { eq: ... } })` returns, without
  the page wrapper. It grants no extra access: every field that needs a
  guard carries its own, exactly as it does through the paginated query.
  """
  user(login: String!): User
  """
  Get all known users
  """
  users(filters: UserFilter, orderBy: UserOrderBy, limit: Int, page: Int): UserPageResult!
  """
  Look up a group by name when the current subject may read it.
  """
  group(name: String!): Group
  """
  Look up an environment by owner and name
  """
  environment(owner: String!, name: String!): Environment
  """
  Look up an environment version by its id.
  """
  environmentVersion(id: String!): EnvironmentVersion
  """
  Get all api keys for the current user.
  """
  apiKeys: [ApiKeyResult!]!
  """
  Get the current user's plan and usage statistics
  """
  planAndUsage: PlanAndSubscription!
  """
  Get all publicly available plans with pricing
  should be used for displaying plans for upgrading in the UI
  """
  availablePlans: [PlanWithPricing!]!
  """
  Get the current user's pending plan change (if any).
  Returns the most recent pending plan change for the authenticated user's owner.
  """
  myPendingPlanChange: PendingPlanChangeDetails
  """
  Get details of a pending plan change by token (for the confirmation page).
  Requires authentication — the user must own the plan change.
  """
  pendingPlanChange(token: String!): PendingPlanChangeDetails
  """
  Get comprehensive channel analytics for tiering decisions.
  Admin-only endpoint.
  """
  channelAnalytics: ChannelAnalytics!
  """
  List all e2e pool users with their lock status.
  """
  e2ePoolUsers: [E2ePoolUser!]!
  """
  The runtime feature configuration of this instance.
  """
  instanceConfig: InstanceConfig!
  """
  Check whether a name can be claimed by a user or group. This is an
  advisory check for user feedback. Database constraints and
  Kratos reservations remain authoritative when the name is claimed.
  """
  ownerNameAvailable(name: String!, flowId: String, allowCurrentUser: Boolean! = false): Boolean!
}

"""
A quota limit definition
"""
type Quota {
  id: Int!
  """
  The maximum value for this quota
  where [`None`] means unlimited
  """
  maxValue: QuotaValue
  """
  The type of resource this quota limits
  """
  limitEntity: LimitEntityType!
  """
  Optional scope qualifier (e.g., only count public or private resources)
  """
  scope: VisibilityType
}

scalar QuotaValue

"""
Different forms of descriptions of an environment.
"""
input SolveEnvironment @oneOf {
  """
  Upload a file containing an environment description.
  """
  file: Upload
  """
  A link pointing to a file containing an environment description
  """
  link: String
  """
  A yaml encoded Conda environment description
  """
  yaml: String
  """
  Explicit environment description
  """
  env: EnvironmentRequest
}

"""
Provides filtering methods for a string.
"""
input StringFilter {
  eq: String
  ne: String
  isIn: [String!]
  isNotIn: [String!]
  startsWith: String
  endsWith: String
  contains: String
}

type Subscription {
  id: Int!
  createdAt: DateTime!
  ownerId: Int!
  """
  The plan this subscription is for
  """
  plan: Plan!
}

"""
Detailed subscription information
"""
type SubscriptionDetails {
  id: Int!
  ownerId: Int!
  planId: Int!
  """
  Status from Stripe (None if not a Stripe subscription)
  """
  status: SubscriptionStatusType
  """
  Billing period from Stripe (None if not a Stripe subscription)
  """
  billingPeriod: BillingPeriodType
  """
  Start of the current billing period (from Stripe)
  """
  currentPeriodStart: DateTime
  """
  End of the current billing period (from Stripe)
  """
  currentPeriodEnd: DateTime
  """
  Whether the subscription will cancel at period end (from Stripe)
  """
  cancelAtPeriodEnd: Boolean
  """
  The plan for this subscription
  """
  plan: Plan!
  """
  Current usage statistics
  """
  usage: Usages!
  """
  Channels owned by this subscription's owner.
  """
  channels: [Channel!]!
}

"""
Subscription status type for GraphQL
"""
enum SubscriptionStatusType {
  ACTIVE
  PAST_DUE
  CANCELED
  UNPAID
  TRIALING
  INCOMPLETE
  PAUSED
}

type TlogEntry {
  integratedTime: String
  logIndex: String
}

type TopDownloadCountObject {
  name: String!
  totalCount: Int!
}

type UpdateQuarantineDryRun {
  quarantineId: Int!
  """
  Variants that would gain membership if this update committed.
  """
  added: PackageVariantPageResult!
  """
  Variants that would lose membership if this update committed.
  """
  released: PackageVariantPageResult!
  addedCount: Int!
  releasedCount: Int!
}

input UpdateQuarantineInput {
  createdAtStart: DateTime
  createdAtEnd: DateTime
  matchspec: String
  """
  Set the stored `createdAtStart` bound to null. Wins over
  `createdAtStart` if both are supplied. Needed because a null
  value in `createdAtStart` itself means "leave the bound alone".
  """
  clearCreatedAtStart: Boolean! = false
  """
  Set the stored `createdAtEnd` bound to null. Wins over
  `createdAtEnd` if both are supplied.
  """
  clearCreatedAtEnd: Boolean! = false
}

"""
Result of an `updateQuarantine` mutation: either the persisted
`Quarantine` or a diff describing the membership change a real
update would produce (added vs released).
"""
union UpdateQuarantineResult = Quarantine | UpdateQuarantineDryRun

"""
A multipart file upload
"""
scalar Upload

type Url {
  """
  The URL
  """
  url: String!
  """
  The type of URL
  """
  kind: UrlKind!
  """
  The rank of this URL relative to the others of the same kind
  """
  order: Int!
}

enum UrlKind {
  DEV
  DOC
  HOME
  SOURCE
  FEEDSTOCK
}

"""
Usage and limit information for a single resource type
"""
type Usage {
  """
  The type of resource this stat is for
  """
  entityType: LimitEntityType!
  """
  Optional scope qualifier
  """
  scope: VisibilityType
  """
  Current usage count/bytes
  """
  used: Int!
  """
  Limit (None = unlimited)
  """
  limit: Int
}

"""
Usage statistics for the current user
"""
type Usages {
  """
  Usage statistics per entity type
  """
  stats: [Usage!]!
}

type User implements Owner {
  """
  The stable owner namespace name for this user.
  """
  name: String!
  """
  The publicly visible username of the user
  """
  login: String!
  """
  Returns all the environments owned by a user
  """
  environments(limit: Int, page: Int): EnvironmentPageResult!
  """
  Returns channels where this user has a role.

  Without a `roles` filter this goes through Melange's `channel#viewer`
  relation, so direct owner/contributor/viewer roles and inherited
  namespace/group role access are included without pulling in
  unrelated public channels. When `roles` is provided this keeps the old
  explicit-membership behavior and filters direct `channel_member` rows for
  the requested roles.
  """
  channels(
    filters: ChannelFilter
    orderBy: ChannelOrderBy
    roles: [ChannelMemberRole!]
    limit: Int
    page: Int
  ): ChannelPageResult!
}

input UserFilter {
  or: [UserFilter!]
  and: [UserFilter!]
  login: StringFilter
  isAdmin: Boolean
}

input UserOrderBy @oneOf {
  byField: UserOrderByField
  bySimilarity: UserOrderBySimilarity
}

input UserOrderByField {
  direction: OrderDirection! = ASC
  field: UserOrderByFieldField!
}

"""
Properties by which channel connections can be ordered.
"""
enum UserOrderByFieldField {
  LOGIN
  IS_ADMIN
}

"""
Ordering options for channels connections
"""
input UserOrderBySimilarity {
  direction: OrderDirection! = DESC
  field: UserOrderBySimilarityField!
  matches: String!
}

enum UserOrderBySimilarityField {
  LOGIN
}

type UserPageResult {
  """
  The items on this page
  """
  page: [User!]!
  """
  The current page index
  """
  current: Int!
  """
  The total number of pages given the limit
  """
  pages: Int!
  """
  The total number of items
  """
  totalCount: Int!
}

"""
Breakdown by visibility (public vs private).
"""
type VisibilityBreakdown {
  public: VisibilityStats!
  private: VisibilityStats!
}

"""
Statistics for a visibility category.
"""
type VisibilityStats {
  channelCount: Int!
  totalStorageBytes: Int!
  avgStorageBytes: Float!
  totalDownloads: Int!
}

"""
Visibility qualifier for quotas
"""
enum VisibilityType {
  PUBLIC
  PRIVATE
}

