type Mutation {
  """
  Create a new environment for the current user.
  """
  createEnvironment(name: String, summary: String! = "", platforms: [String!]!, request: SolveEnvironment!): EnvironmentVersion!
  """
  Updates an environment
  """
  updateEnvironment(owner: String!, name: String!, summary: String): Environment!
  """
  Creates a new environment version for an existing environment
  """
  createEnvironmentVersion(owner: String!, name: String!, platforms: [String!]!, request: SolveEnvironment!): EnvironmentVersion!
  """
  Create a new API Key for the current user.
  """
  createApiKey(
    """
    The name for the api key
    """
    name: String!
    """
    The description for the api key
    """
    description: String
    """
    The date and time when the api key expires (default: 30 days)
    """
    expiresAt: DateTime
    """
    The access mode granted by the api key
    """
    accessMode: ChannelAccessMode
    """
    The channel this api key is scoped to
    """
    channelName: String
  ): ApiKeyResult!
  """
  Revoke an api key for the current user.
  The api key must be owned by the current user.
  Once revoked, the key can no longer be used for authentication.
  """
  revokeApiKey(
    """
    The name of the api key
    """
    name: String!
  ): Boolean!
  """
  Delete an api key for the current user.
  The api key must be owned by the current user.
  """
  deleteApiKey(
    """
    The name of the api key
    """
    name: String!
  ): Boolean!
  """
  Create a new channel for the current user.
  """
  createChannel(
    name: String!
    description: String
    isPublic: Boolean
    logo: String
    channelRelationBase: String
    channelRelationOverrides: String
    allowV3Uploads: Boolean
  ): ChannelResult!
  """
  Publish a CEP-6 notice for a channel.
  """
  createChannelNotice(
    channelName: String!
    id: String!
    message: String!
    level: ChannelNoticeLevel!
    expiresAt: DateTime
  ): ChannelNotice!
  """
  Update a CEP-6 notice for a channel.
  """
  updateChannelNotice(
    channelName: String!
    id: String!
    message: String!
    level: ChannelNoticeLevel!
    expiresAt: DateTime
  ): ChannelNotice!
  """
  Delete a CEP-6 notice from a channel.
  """
  deleteChannelNotice(channelName: String!, id: String!): Boolean!
  """
  Update a channel
  """
  updateChannel(
    name: String!
    description: String
    isPublic: Boolean
    logo: String
    channelRelationBase: String
    channelRelationOverrides: String
    allowV3Uploads: Boolean
  ): ChannelResult!
  """
  Delete channel from the database
  """
  deleteChannel(name: String!): ChannelResult!
  """
  Add a channel_member
  """
  addChannelMember(userName: String!, channelName: String!, role: ChannelMemberRole!): ChannelMember!
  """
  delete a channel_member
  """
  deleteChannelMember(userName: String!, channelName: String!): ChannelMember!
  """
  Add a Github OIDC publisher to a channel
  """
  addGithubOidcPublisher(
    channelName: String!
    repositoryOwner: String!
    repositoryName: String!
    workflowFilename: String!
    environment: String
    accessMode: ChannelAccessMode
  ): GithubPublisher!
  """
  Add a GitLab OIDC publisher to a channel
  """
  addGitlabOidcPublisher(
    channelName: String!
    namespace: String!
    project: String!
    workflowFilepath: String!
    environment: String
    accessMode: ChannelAccessMode
  ): GitlabPublisher!
  """
  Add a Google OIDC publisher to a channel
  """
  addGoogleOidcPublisher(channelName: String!, email: String!, sub: String, accessMode: ChannelAccessMode): GooglePublisher!
  """
  Delete an OIDC publisher by ID
  """
  deleteOidcPublisher(channelName: String!, id: String!): OidcPublisher!
  """
  Copy package files into an existing channel from complete package
  URLs. Every URL must point at a single package file and carry a
  SHA-256 pin of the expected content. The copy always runs
  asynchronously: the returned background job tracks per-file progress
  and records machine-readable per-file results when it finishes. URLs
  that point at a channel hosted on this server are verified and
  read-authorized up front and copied without downloading (package
  blobs are content-addressed); all other URLs are downloaded and
  verified against the pin by the background worker.
  """
  copyPackagesFromUrls(channelName: String!, packages: [CopyPackageUrlInput!]!): BackgroundJob!
  """
  Yank multiple package variants from a channel in a single
  transaction. Reindex workflows are triggered once per unique
  subdir after all entries are updated.
  """
  batchYankPackageVariants(channelName: String!, entries: [PackageVariantInput!]!, reason: String!, alsoHide: Boolean): Boolean!
  """
  Unyank multiple package variants from a channel in a single
  transaction. Reindex workflows are triggered once per unique
  subdir after all entries are updated.
  """
  batchUnyankPackageVariants(channelName: String!, entries: [PackageVariantInput!]!, alsoUnhide: Boolean): Boolean!
  """
  Apply a package quarantine to a channel. Server admins only.

  A quarantine records an action (`yank` or `delete`) that applies to
  every `package_entry` matched by the selector. `yank` routes the
  entry through repodata's `removed` section (download still works);
  `delete` omits the entry from repodata/shards and returns 410 on
  direct download. Both are reversible via `revokeQuarantine`.

  Selectors: a variant list (one or more filenames, all resolving to
  the same package), a time range on `package_entry.created_at`, or a
  conda matchspec. All are optionally scoped to a subdir.
  """
  applyQuarantine(
    channelName: String!
    action: QuarantineAction!
    selector: QuarantineSelector!
    reason: String!
    metadata: JSON
    allowEmpty: Boolean! = false
    dryRun: Boolean! = false
    dryRunOptions: QuarantineDryRunOptions
  ): QuarantineResult!
  """
  Revoke an active quarantine by id. Clears the M:N memberships for
  that quarantine and recomputes `is_download_blocked` / `yanked_reason`
  on the affected `package_entry` rows from the remaining active
  quarantines. Server admins only.
  """
  revokeQuarantine(quarantineId: Int!): Quarantine!
  """
  Narrow the scope of an active quarantine. Updateable fields:
  `createdAtStart`, `createdAtEnd`, `matchspec`. Re-evaluates M:N
  memberships, releasing entries that no longer match and adding
  entries that newly match. Server admins only.
  """
  updateQuarantine(
    quarantineId: Int!
    input: UpdateQuarantineInput!
    dryRun: Boolean! = false
    dryRunOptions: QuarantineDryRunOptions
  ): UpdateQuarantineResult!
  """
  Transfer ownership of a channel to another user.
  The new owner must already exist in the system.
  If the new owner is already a member, their membership is upgraded to Owner.
  The previous owner is demoted to Contributor.
  Cannot be used on mirrored channels.
  Admins can transfer any channel; regular users must be the channel owner.
  """
  transferChannelOwnership(channelName: String!, newOwnerUsername: String!, makePrimary: Boolean! = false): ChannelResult!
  """
  Select the channel that owns a namespace's bare path. Group namespaces
  require the group Owner, personal namespaces their user; site admins
  may act on both. Session-only, like other namespace-level settings.

  Promoting a channel atomically demotes the current primary (if any) to
  its scoped `namespace/name` path. Passing a null `channelName` demotes
  the current primary without promoting a replacement, leaving the bare
  namespace path unclaimed. Whenever a primary would be demoted the
  request must pass `replaceExisting`; the refusal carries the current
  primary so clients can ask for confirmation. Channel visibility is
  unchanged.
  """
  setNamespacePrimaryChannel(
    namespace: String!
    """
    The channel to promote; null demotes the current primary without a replacement.
    """
    channelName: String
    """
    Confirm demoting the existing primary channel to its scoped path.
    """
    replaceExisting: Boolean! = false
  ): NamespacePrimaryChannelResult!
  """
  Delete multiple package variants from a channel in a single
  transaction. Reindex workflows are triggered once per unique
  subdir after all entries are removed.
  """
  batchDeletePackageVariants(channelName: String!, entries: [PackageVariantInput!]!): Boolean!
  """
  Start an asynchronous batch deletion of entire packages (all versions and platforms).
  Returns a job object that can be polled for progress.
  """
  startBatchDeletePackages(channelName: String!, packageNames: [String!]!): BackgroundJob!
  """
  Get current subscription details
  """
  mySubscription: SubscriptionDetails
  """
  Confirm a pending plan change (user action from confirmation page).
  Executes the subscription update with the locked proration details.
  """
  confirmPlanChange(token: String!): PendingPlanChangeDetails!
  """
  Decline a pending plan change (user action from confirmation page).
  """
  declinePlanChange(token: String!): PendingPlanChangeDetails!
  """
  Update group metadata and visibility. Group Owners and site admins only.
  """
  updateGroup(name: String!, displayName: String, description: String, isPublic: Boolean): Group!
  """
  Seed all e2e test users in Kratos and the database.
  """
  e2eSeedUsers: Boolean!
  """
  Atomically acquire a pool user. When `username` is provided, locks that
  specific user (for manual testing). Otherwise picks the next available
  user matching the optional `admin` filter (for test workers).
  Stale locks (older than 5 minutes) are automatically released first.
  """
  e2eAcquireUser(admin: Boolean, username: String): E2ePoolUser!
  """
  Release a previously acquired pool user, making it available for other workers.
  """
  e2eReleaseUser(username: String!): Boolean!
}

