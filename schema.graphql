type Channel {
  """
  The local name of the channel within its namespace.
  """
  name: String!
  """
  The canonical root-relative path for this channel.
  """
  channelPath: String!
  """
  The namespace that defines this channel's public identity.
  """
  namespace: Owner!
  isPrimary: Boolean!
  """
  Whether the channel is public or not.
  """
  isPublic: Boolean!
  """
  The description of the channel.
  """
  description: String
  """
  The logo of the channel.
  """
  logo: String
  """
  The date when the object was created.
  """
  createdAt: DateTime!
  """
  The date when the object was last updated.
  """
  updatedAt: DateTime!
  """
  The base url from where packages are downloaded.
  """
  baseUrl: String!
  """
  The account billed for this channel, which may be a group the reader
  has nothing to do with.

  Unlike `namespace`, billing implies no relationship: a public channel in
  someone's own namespace can be billed to a private group, and reading
  that channel says nothing about being allowed to see the group. So a
  private group the caller cannot read is withheld entirely rather than
  returned with its fields emptied.
  """
  owner: Owner
  """
  The mirror of the channel. If any.
  """
  mirror: ChannelMirror
  """
  CEP-6 notices published by this channel.
  """
  notices: [ChannelNotice!]!
  """
  Packages present in the channel.
  """
  packages(filters: PackageFilter, orderBy: PackageOrderBy, limit: Int, page: Int): PackagePageResult!
  """
  Quarantines applied to packages in this channel. Admin-only.
  Returns active quarantines by default; pass
  `filter: { includeRevoked: true }` to also see historical
  entries. Filter by `packageName` / `action` via the same
  `QuarantineFilter` input.
  """
  quarantines(filter: QuarantineFilter, limit: Int, page: Int): QuarantinePageResult!
  """
  Channel Members
  """
  channelMembers: [ChannelMember!]!
  """
  Channel OIDC Publishers
  """
  oidcPublishers: [Publisher!]!
  """
  The size of all packages in the channel in bytes.
  """
  size: Int!
  """
  CEP-0042 `base` related channel: another channel hosted on this server
  that takes precedence over this one during dependency resolution.
  """
  channelRelationBase: Channel
  """
  CEP-0042 `overrides` related channel: another channel hosted on this
  server that this channel takes precedence over during dependency
  resolution.
  """
  channelRelationOverrides: Channel
  """
  Whether this channel accepts packages that require v3 repodata syntax.
  """
  allowV3Uploads: Boolean!
  """
  Retrieve the total download count of packages for this channel
  """
  totalCount: [TopDownloadCountObject!]!
  """
  Retrieve the monthly download count for this channel
  """
  monthlyCount: [MonthlyDownloadCountObject!]!
  """
  Retrieve the daily channel size history.
  Returns the total size of the channel at the end of each day.
  Use `days` to limit how far back to look (default: 30, max: 90).
  """
  dailySizeHistory(days: Int! = 90): [DailyChannelSizePoint!]!
}

enum ChannelAccessMode {
  """
  Full legacy API-key access. Only used for unscoped user API keys.
  """
  ALL
  """
  Read channel metadata and packages.
  """
  READ
  """
  Read packages, upload packages, and yank/unyank package variants.
  """
  READ_WRITE
  """
  Read, upload, yank/unyank, and delete package variants.
  """
  READ_WRITE_DELETE
}

type ChannelAnalytics {
  """
  Summary statistics for all channels.
  """
  summary: AnalyticsSummary!
  """
  Distribution of channels by storage size.
  """
  storageDistribution: [DistributionBucket!]!
  """
  Distribution of channels by member count.
  """
  memberDistribution: [DistributionBucket!]!
  """
  Distribution of channels per owner.
  """
  channelsPerOwnerDistribution: [DistributionBucket!]!
  """
  Distribution of channels by package count.
  """
  packageCountDistribution: [DistributionBucket!]!
  """
  Distribution of channels by download count (last 30 days).
  """
  downloadDistribution: [DistributionBucket!]!
  """
  Distribution of channels by age.
  """
  ageDistribution: [DistributionBucket!]!
  """
  Breakdown by public vs private channels.
  """
  visibilityBreakdown: VisibilityBreakdown!
  """
  Top channels by storage size.
  """
  topChannelsByStorage(limit: Int! = 20): [ChannelStats!]!
  """
  Top channels by download count.
  """
  topChannelsByDownloads(limit: Int! = 20): [ChannelStats!]!
  """
  Top owners by total storage with pagination.
  """
  topOwnersByTotalStorage(
    """
    Items per page (max 100)
    """
    limit: Int! = 20
    """
    Page number (0-indexed)
    """
    page: Int! = 0
  ): OwnerStatsPageResult!
  """
  Top owners by channel count with pagination.
  """
  topOwnersByChannelCount(
    """
    Items per page (max 100)
    """
    limit: Int! = 20
    """
    Page number (0-indexed)
    """
    page: Int! = 0
  ): OwnerStatsPageResult!
  """
  Analyze impact of applying specific tier thresholds.
  NOT cached - has dynamic user-provided parameters.
  """
  impactAnalysis(
    """
    Storage threshold in bytes
    """
    storageThresholdBytes: Int
    """
    Member count threshold
    """
    memberThreshold: Int
    """
    Max total channels per owner
    """
    channelLimit: Int
    """
    Max public channels per owner
    """
    publicChannelLimit: Int
    """
    Max private channels per owner
    """
    privateChannelLimit: Int
  ): ImpactAnalysis!
}

