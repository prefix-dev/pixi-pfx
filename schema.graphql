type Mutation {
  """
  Create a new environment for the current user.
  """
  createEnvironment(name: String, summary: String! = "", platforms: [String!]!, request: SolveEnvironment!): EnvironmentVersion!
  """
  Updates an environment
  """
  updateEnvironment(owner: String!, name: String!, summary: String): Environment!
  """
  Creates a new environment version for an existing environment
  """
  createEnvironmentVersion(owner: String!, name: String!, platforms: [String!]!, request: SolveEnvironment!): EnvironmentVersion!
  """
  Create a new API Key for the current user.
  """
  createApiKey(
    """
    The name for the api key
    """
    name: String!
    """
    The description for the api key
    """
    description: String
    """
    The date and time when the api key expires (default: 30 days)
    """
    expiresAt: DateTime
  ): ApiKeyResult!
  """
  Revoke an api key for the current user.
  The api key must be owned by the current user.
  Once revoked, the key can no longer be used for authentication.
  """
  revokeApiKey(
    """
    The name of the api key
    """
    name: String!
  ): Boolean!
  """
  Delete an api key for the current user.
  The api key must be owned by the current user.
  """
  deleteApiKey(
    """
    The name of the api key
    """
    name: String!
  ): Boolean!
  """
  Create a new channel for the current user.
  """
  createChannel(name: String!, description: String, isPublic: Boolean, logo: String): ChannelResult!
  """
  Update a channel
  """
  updateChannel(
    name: String!
    description: String
    isPublic: Boolean
    logo: String
    requiredChannels: [String!]
  ): ChannelResult!
  """
  Delete channel from the database
  """
  deleteChannel(name: String!): ChannelResult!
  """
  Add a channel_member
  """
  addChannelMember(userName: String!, channelName: String!, role: ChannelMemberRole!): ChannelMember!
  """
  delete a channel_member
  """
  deleteChannelMember(userName: String!, channelName: String!): ChannelMember!
  """
  Add a Github OIDC publisher to a channel
  """
  addGithubOidcPublisher(
    channelName: String!
    repositoryOwner: String!
    repositoryName: String!
    workflowFilename: String!
    environment: String
  ): GithubPublisher!
  """
  Add a GitLab OIDC publisher to a channel
  """
  addGitlabOidcPublisher(
    channelName: String!
    namespace: String!
    project: String!
    workflowFilepath: String!
    environment: String
  ): GitlabPublisher!
  """
  Add a Google OIDC publisher to a channel
  """
  addGoogleOidcPublisher(channelName: String!, email: String!, sub: String): GooglePublisher!
  """
  Delete an OIDC publisher by ID
  """
  deleteOidcPublisher(channelName: String!, id: String!): OidcPublisher!
  """
  Yank a package variant from a channel.
  This marks a specific build (platform/subdir variant) as yanked, not the entire package.
  """
  yankPackageVariant(channelName: String!, subdir: String!, filename: String!, reason: String!): Boolean!
  """
  Unyank a package variant from a channel.
  This clears the yanked status of a specific build (platform/subdir variant).
  """
  unyankPackageVariant(channelName: String!, subdir: String!, filename: String!): Boolean!
  """
  Transfer ownership of a channel to another user.
  The new owner must already exist in the system.
  If the new owner is already a member, their membership is upgraded to Owner.
  The previous owner is demoted to Contributor.
  Cannot be used on mirrored channels.
  Admins can transfer any channel; regular users must be the channel owner.
  """
  transferChannelOwnership(channelName: String!, newOwnerUsername: String!): ChannelResult!
  """
  Delete multiple package variants from a channel in a single
  transaction. Reindex workflows are triggered once per unique
  subdir after all entries are removed.
  """
  batchDeletePackageVariants(channelName: String!, entries: [PackageVariantInput!]!): Boolean!
}

