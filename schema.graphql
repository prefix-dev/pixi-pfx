"""
Public projection of a quarantine surfaced on `Package.activeQuarantines`.
Carries the same auditable fields as [`PublicQuarantineObject`] plus the
selector tagged-union so a client can render a human-readable description
(e.g. "packages matching `python >3` on linux-64", "uploaded between Apr 1
and Apr 15, 2026") without a second round-trip.

Selector internals are deliberately omitted from
[`PublicQuarantineObject`] because that projection is exposed per-variant,
where the selector reveals nothing useful and could leak operational
signals across packages. On the package's own detail page the selector is
scoped to *this* package by definition: the filenames, subdir, matchspec,
and time bounds describe a subset of what the variants table directly
below already shows. Disclosing them here is consistent with what the
viewer can already see, so the richer projection is safe.

Admin-only fields (`metadata`, audit user ids) remain on
[`QuarantineObject`].
"""
