"""
A channel affected by tier limits.
"""
type AffectedChannel {
  sizeBytes: Int!
  memberCount: Int!
  """
  Whether this channel exceeds the storage limit.
  """
  overStorage: Boolean!
  """
  Whether this channel exceeds the member limit.
  """
  overMembers: Boolean!
  channel: Channel!
}

"""
An owner affected by tier limits.
"""
type AffectedOwner {
  ownerId: Int!
  ownerName: String
  """
  Number of channels this owner has that exceed per-channel limits.
  """
  affectedChannelCount: Int!
  """
  Total storage across all the owner's channels.
  """
  totalStorageBytes: Int!
  """
  Total number of channels this owner has.
  """
  totalChannelCount: Int!
  """
  Number of public channels this owner has.
  """
  publicChannelCount: Int!
  """
  Number of private channels this owner has.
  """
  privateChannelCount: Int!
  """
  Whether this owner exceeds the total channel limit.
  """
  overChannelLimit: Boolean!
  """
  Whether this owner exceeds the public channel limit.
  """
  overPublicChannelLimit: Boolean!
  """
  Whether this owner exceeds the private channel limit.
  """
  overPrivateChannelLimit: Boolean!
}

